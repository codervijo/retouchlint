<!-- Source for public/og-image.png (1200x630). Regenerate with Inkscape: export as PNG
     to public/og-image.png (see the v1.E commit for the exact command). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="8" fill="#1f3348"/>

  <!-- brand -->
  <g transform="translate(72,64)">
    <rect width="48" height="48" rx="10" fill="#1f3348"/>
    <g transform="translate(10,10) scale(1.1667)" fill="none" stroke="#fbfcfe" stroke-width="2">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <path d="M3 15l5-5 4 4 3-3 6 6"/>
      <circle cx="9" cy="9" r="1.4" fill="#fbfcfe"/>
    </g>
    <text x="64" y="34" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#141b24">RetouchLint</text>
  </g>

  <!-- headline -->
  <text font-family="DejaVu Serif, serif" font-size="64" fill="#141b24">
    <tspan x="72" y="236">AB 723 listing</tspan>
    <tspan x="72" y="314">photo disclosure</tspan>
  </text>
  <text font-family="DejaVu Sans, sans-serif" font-size="26" fill="#5d6673">
    <tspan x="72" y="382">Disclosure statement + link to the</tspan>
    <tspan x="72" y="418">original image, for California listings.</tspan>
  </text>
  <text x="72" y="540" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1f3348">Bus. &amp; Prof. Code § 10140.8 · CRMLS Rule 11.5.2</text>

  <!-- original / altered pair -->
  <g transform="translate(700,150)">
    <rect width="200" height="150" rx="10" fill="#c3c9d2"/>
    <polygon points="0,110 40,80 75,100 110,70 150,95 200,75 200,150 0,150" fill="#2f4a38"/>
    <rect x="80" y="85" width="60" height="45" fill="#efe7d9"/>
    <polygon points="80,85 110,60 140,85" fill="#8a4b36"/>
    <rect x="98" y="100" width="12" height="30" fill="#4a3329"/>
    <text x="0" y="182" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#141b24">Original</text>
  </g>
  <g transform="translate(930,150)">
    <rect width="200" height="150" rx="10" fill="#7fb6d6"/>
    <polygon points="0,110 40,80 75,100 110,70 150,95 200,75 200,150 0,150" fill="#3f7a4e"/>
    <rect x="80" y="85" width="60" height="45" fill="#efe7d9"/>
    <polygon points="80,85 110,60 140,85" fill="#8a4b36"/>
    <rect x="98" y="100" width="12" height="30" fill="#4a3329"/>
    <text x="0" y="182" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#141b24">Digitally altered</text>
  </g>
  <g transform="translate(700,370)">
    <rect width="430" height="120" rx="12" fill="#f4f6f9" stroke="#e3e7ec"/>
    <text x="24" y="44" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#141b24">Sky replaced · lawn enhanced</text>
    <text x="24" y="84" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#2f8f6a">● Original linked · attested</text>
